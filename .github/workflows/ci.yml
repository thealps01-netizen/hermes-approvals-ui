# The gates that need no Hermes install run on both runners; the checks that need the application's
# own sources get a SPARSE, pinned checkout of the core so they RUN instead of quietly skipping
# themselves (`tools/`, `agent/` and `hermes_cli/` are read by the core-contract gate; those plus `pm/`,
# `providers/` and `hermes_platform/` are imported by the backend selftest, which runs against that
# checkout with fastapi/pyyaml/ruamel.yaml/requests/httpx). Only the
# measured Electron render with its contrast gate stays local; see README § "Continuous integration".
name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

env:
  PYTHONUTF8: "1"   # Windows runners print cp1252 otherwise; audit messages carry non-ASCII
  # The core revision this panel is verified against: the OLDEST supported release, the floor that
  # `requires_hermes` in plugin.yaml declares (v0.22.0). Move both together: an older core lacks the
  # memory `patch` action and the two-argument `skill_pending_diff` the backend relies on.
  CORE_REPO: https://github.com/NousResearch/hermes-agent.git
  CORE_SHA: e06df9c2eae6901f4c88f464e0ae6e753c0428b8 # v0.22.0

jobs:
  gates:
    name: gates (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: tests/package-lock.json

      - name: Install the jsdom gate dependencies
        working-directory: tests
        run: npm ci

      - name: Core sources for the token and stylesheet checks (sparse, pinned)
        run: |
          set -euo pipefail
          core="$RUNNER_TEMP/hermes-core"
          git init -q "$core"
          git -C "$core" remote add origin "$CORE_REPO"
          git -C "$core" sparse-checkout init --cone
          git -C "$core" sparse-checkout set apps/desktop/src tools agent hermes_cli pm providers hermes_platform
          for i in 1 2 3; do git -C "$core" fetch -q --depth 1 origin "$CORE_SHA" && break; sleep $((i*20)); done
          git -C "$core" checkout -q FETCH_HEAD
          test -d "$core/apps/desktop/src" || { echo "core sources missing"; exit 1; }
          test -f "$core/tools/write_approval.py" || { echo "core backend sources missing"; exit 1; }
          echo "HERMES_AGENT_DIR=$core" >> "$GITHUB_ENV"

      - name: Static audit
        run: python tests/audit_static.py

      - name: Canary run (every rule must be able to fail)
        run: python tests/canary_audit.py

      - name: Core contract (the core names the plugin calls, at the pinned sha)
        run: python tests/contract_core.py

      - name: Core contract canary (every way it can fail must fire)
        run: python tests/contract_core.py --selftest

      - name: Backend selftest (against the pinned core, review gate on; tests/backend_selftest.py)
        run: |
          set -euo pipefail
          python -m pip install -q fastapi pyyaml ruamel.yaml requests httpx
          unset HERMES_HOME
          PYTHONPATH="$HERMES_AGENT_DIR" python dashboard/plugin_api.py --selftest

      - name: Audit regressions (each case is a confirmed 1.12.4 audit finding; tests/regress_audit.py)
        run: |
          set -euo pipefail
          unset HERMES_HOME
          PYTHONPATH="$HERMES_AGENT_DIR" python tests/regress_audit.py

      - name: Render and behaviour (jsdom)
        working-directory: tests
        run: node render_check.mjs

      - name: Static preview (5 frames, dark + light, app stylesheet)
        working-directory: tests
        run: node preview.mjs
